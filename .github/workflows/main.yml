name: Java CI with Gradle

on:
  workflow_dispatch
  
jobs:
  build:

    runs-on: macos-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build with Gradle Wrapper
      run: ./gradlew build
      
    - name: Upload Metal .jar 
      uses: actions/upload-artifact@v7.0.2
      with:
        name: mcopt
        path: metal/build/libs
        archive: false

    - name: Upload fpshud .jar 
      uses: actions/upload-artifact@v7.0.2
      with:
        name: mcopt
        path: fpshud/build/libs
        archive: false
